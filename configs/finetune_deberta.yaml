# 512-token comparison: DeBERTa-v3-base from the MoritzLaurer MNLI/FEVER/ANLI checkpoint. No augmentation
# (512 tokens cannot hold a padded context). Run on the RTX 4070 after finetune_modernbert.yaml.
name: deberta-nli-ft
base_model: deberta_nli
max_length: 512
hypothesis: qa
train_slices: [ragtruth_train, phantom_train, halueval_norm_train]
val_slices: [ragtruth_val, phantom_val, halueval_norm_val]
oversample: {phantom: 3}
epochs: 2
batch_size: 8
eval_batch_size: 16
grad_accum: 2
learning_rate: 2.0e-5
warmup_ratio: 0.1
seeds: [42]
