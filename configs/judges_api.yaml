# API judges (secondary comparison). Needs keys in .env and pinned models in configs/providers.yaml.
# Run `python -m src.cli probe-api` first. Windows are in whitespace words (~1.3 tokens each).
# The HaluEval rewriter (default: dartmouth) must not judge HaluEval; `evaluate` flags it if it does.
name: judges_api
runs:
  - name: gemini_judge
    detector: {type: api_judge, provider: gemini, max_length: 30000}
    strategies:
      - {strategy: truncate, window: 30000}
      - {strategy: retrieve, window: 1500, overlap: 750, top_k: 3}
    slices: [phantom_grid_sub, phantom_val, ragtruth_test]
    max_pairs: 100

  - name: dartmouth_judge
    detector: {type: api_judge, provider: dartmouth, max_length: 6000}
    strategies:
      - {strategy: truncate, window: 6000}
      - {strategy: retrieve, window: 1500, overlap: 750, top_k: 3}
    slices: [phantom_grid_sub, phantom_val, ragtruth_test]
    max_pairs: 100
