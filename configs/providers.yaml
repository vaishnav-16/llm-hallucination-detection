# API providers for LLM judges and the HaluEval rewrite.
# Keys come from environment variables (put them in .env, which git ignores), never from this file.
# Run `python -m src.cli probe-api` first: it lists available models and checks context length and logprobs.
# Then pin `model` below to a dated model id from the probe output.

dartmouth:
  base_url: https://chat.dartmouth.edu/api       # Open WebUI, OpenAI-compatible: /chat/completions, /models
  api_key_env: DARTMOUTH_CHAT_API_KEY             # create under Settings > Account > API keys on chat.dartmouth.edu
  model: null                                     # pin after probing; prefer a local (on-prem) model, e.g. a Llama/Mistral id
  probability: logprobs                           # logprobs | sampling | verbalized  (probe tells which works)
  requests_per_minute: 30
  max_context_tokens: null                        # filled in from the probe

gemini:
  base_url: https://generativelanguage.googleapis.com/v1beta/openai
  api_key_env: GEMINI_API_KEY                     # https://aistudio.google.com/apikey (free tier)
  model: null                                     # pin a dated Flash-Lite id from the probe
  probability: sampling                           # 3.x models reportedly no longer return logprobs
  samples: 5
  requests_per_minute: 10
  max_context_tokens: null

# Headless Claude Code (`claude -p`) on the logged-in Claude subscription; no API key. HaluEval rewrite only
# (`rewrite-halueval --provider claude_cli`), never a judge on HaluEval. One subprocess per answer, no tools,
# no MCP, no saved session. No temperature control: the committed jsonl is the only exact record.
claude_cli:
  model: claude-haiku-5-5                         # chosen over claude-sonnet-5-5 on a 50-pair comparison (see HANDOFF.md)
  timeout_s: 180                                  # per subprocess
  max_retries: 5                                  # exponential backoff from backoff_s, then the run raises
  backoff_s: 15
