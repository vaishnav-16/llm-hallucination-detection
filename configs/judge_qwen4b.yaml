# Open-weight LLM judge on the RTX 4070 (4-bit). Next-token P(No) / (P(Yes)+P(No)), no sampling.
# 12K-token windows cover seed-10K contexts natively; longer contexts are chunked or retrieved.
# 40 pairs per cell. Rough time: 5-7 h.   python -m src.cli score --config configs/judge_qwen4b.yaml --device cuda
name: judge_qwen4b
runs:
  - name: qwen3_4b
    detector: {type: local_llm, model: qwen3_4b, load_in_4bit: true, max_length: 13000, batch_size: 1}
    strategies:
      - {strategy: chunk, window: 12000, overlap: 2048}
      - {strategy: retrieve, window: 2048, overlap: 1024, top_k: 3, retriever: bm25_blockidf}
    slices: [phantom_grid_sub, phantom_val, halueval_norm_test, halueval_norm_val, ragtruth_test, ragtruth_val]
    max_pairs: 40
